name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lucky_seven_test
          POSTGRES_USER: lucky_seven
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lucky_seven -d lucky_seven_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lucky_seven:ci_ephemeral_password@localhost:5432/lucky_seven_test?sslmode=disable
      REQUIRE_DATABASE_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - name: Unit and PostgreSQL integration tests with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci_ephemeral_password
      POSTGRES_PORT: "5433"
      API_PORT: "8082"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start fresh database and API
        run: docker compose up --build --wait --wait-timeout 120
      - name: Verify actual HTTP flow and idempotency
        run: python3 scripts/smoke-api.py http://localhost:8082
      - name: Restart and verify persisted balance and result
        run: |
          docker compose restart
          docker compose up --wait --wait-timeout 120
          python3 scripts/smoke-api.py http://localhost:8082
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop CI containers
        if: always()
        run: docker compose down
